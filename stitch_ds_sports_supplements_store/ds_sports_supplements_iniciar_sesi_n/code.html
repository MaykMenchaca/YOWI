<style>
        .login-card-shadow {
            box-shadow: 0px 4px 20px rgba(4, 44, 83, 0.05);
        }

<body class="bg-surface-container-low min-h-screen flex flex-col font-body-md text-on-surface antialiased">
<!-- TopNavBar Suppressed due to Transactional Page Intent -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter">
<div class="w-full max-w-md bg-surface-container-lowest border border-[#B5D4F4] rounded-lg login-card-shadow p-stack-lg transition-all duration-300">
<div class="text-center mb-stack-lg">
<span class="font-headline-lg text-headline-lg font-bold text-primary block mb-stack-sm tracking-tight">[DS]</span>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface mt-2">Iniciar sesión</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Accede a tu cuenta de Premium Supplements.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="email">Correo electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-[#B5D4F4] rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-[#378ADD] focus:border-[#378ADD] transition-colors" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-[#B5D4F4] rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-[#378ADD] focus:border-[#378ADD] transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center">
<button aria-label="Mostrar contraseña" class="text-outline-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="toggleIcon" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
</div>
<!-- Aux Options -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-[#B5D4F4] text-primary-container focus:ring-primary-container bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Recuérdame
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm font-medium text-[#185FA5] hover:text-[#378ADD] transition-colors" href="#">
                            ¿Olvidaste tu contraseña?
                        </a>
</div>
</div>
<!-- CTA Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded bg-primary-container hover:bg-[#134D86] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container font-headline-sm text-headline-sm font-bold text-on-primary shadow-sm hover:scale-[1.02] transition-transform duration-200" type="submit">
                        Entrar
                    </button>
</div>
</form>
<!-- Divider & Secondary Link -->
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant/30 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    ¿No tienes una cuenta?
                    <a class="font-label-bold text-label-bold text-[#185FA5] hover:text-[#378ADD] transition-colors ml-1" href="#">
                        Crear cuenta
                    </a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-on-background dark:bg-surface-container-lowest w-full py-section-padding no-border flat no shadows">
<div class="grid grid-cols-1 md:grid-cols-4 gap-gutter px-8 max-w-container-max mx-auto">
<!-- Brand & Copyright -->
<div class="flex flex-col gap-4">
<span class="font-headline-sm text-headline-sm font-bold text-surface-container-lowest dark:text-on-background">[DS]</span>
<p class="font-body-sm text-body-sm text-surface-variant dark:text-on-surface-variant">© 2024 [DS] Premium Supplements. All rights reserved.</p>
</div>
<!-- Links Column 1 -->
<div class="flex flex-col gap-3">
<a class="font-body-sm text-body-sm text-surface-variant dark:text-on-surface-variant hover:text-secondary-container dark:hover:text-secondary transition-colors cursor-pointer" href="#">Privacy Policy</a>
<a class="font-body-sm text-body-sm text-surface-variant dark:text-on-surface-variant hover:text-secondary-container dark:hover:text-secondary transition-colors cursor-pointer" href="#">Terms of Service</a>
</div>
<!-- Links Column 2 -->
<div class="flex flex-col gap-3">
<a class="font-body-sm text-body-sm text-surface-variant dark:text-on-surface-variant hover:text-secondary-container dark:hover:text-secondary transition-colors cursor-pointer" href="#">Shipping Info</a>
<a class="font-body-sm text-body-sm text-surface-variant dark:text-on-surface-variant hover:text-secondary-container dark:hover:text-secondary transition-colors cursor-pointer" href="#">Contact Us</a>
</div>
<!-- Support -->
<div class="flex flex-col gap-3 md:items-end">
<a class="font-body-sm text-body-sm text-surface-variant dark:text-on-surface-variant hover:text-secondary-container dark:hover:text-secondary transition-colors cursor-pointer flex items-center gap-2" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chat</span>
                    WhatsApp Support
                 </a>
</div>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }
    </script>
