<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Distribuidor de Suplementos</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png"/>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-ink text-slate-100 font-body antialiased min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <img src="../assets/img/logo-ds-clean.png" alt="Distribuidor de Suplementos" class="h-16 w-auto mx-auto mb-3"/><p class="font-display font-extrabold text-2xl uppercase tracking-tight text-white">Distribuidor de <span class="text-lime">Suplementos</span></p>
      <p class="text-slate-400 text-xs mt-1 uppercase tracking-widest">Panel de administración</p>
    </div>

    <div class="bg-slate-800 rounded-none shadow-xl p-8 border border-slate-700">
      <h1 class="font-display font-extrabold text-2xl uppercase tracking-tight text-white border-l-4 border-lime pl-3 mb-6">Iniciar sesión</h1>

      <div id="login-error" class="mb-4 text-red-400 text-sm hidden"></div>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-1.5" for="email">Correo electrónico</label>
          <input
            id="email" name="email" type="email" autocomplete="username"
            required
            class="w-full bg-slate-900 border border-slate-600 rounded-none px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand"
            placeholder="admin@ejemplo.com"
          />
        </div>
        <div class="mb-6">
          <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-1.5" for="password">Contraseña</label>
          <input
            id="password" name="password" type="password" autocomplete="current-password"
            required
            class="w-full bg-slate-900 border border-slate-600 rounded-none px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand"
            placeholder="••••••••"
          />
        </div>
        <!-- Segundo factor: se muestra solo si la cuenta tiene 2FA activo. -->
        <div class="mb-6 hidden" id="totp-field">
          <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-1.5" for="totp">Código de verificación (2FA)</label>
          <input
            id="totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
            class="w-full bg-slate-900 border border-slate-600 rounded-none px-4 py-2.5 text-slate-100 placeholder-slate-500 tracking-[0.4em] text-center focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand"
            placeholder="000000"
          />
          <p class="text-slate-500 text-xs mt-1.5">Ingresa el código de 6 dígitos de tu app autenticadora.</p>
        </div>
        <button
          type="submit"
          class="w-full btn btn-brand"
        >
          Entrar
        </button>
      </form>
    </div>
    <p class="text-center text-slate-600 text-xs mt-6 uppercase tracking-widest">Acceso restringido · solo personal autorizado</p>
  </div>

  <script src="../assets/js/admin/api-client.js"></script>
  <script src="../assets/js/admin/auth.js"></script>
</body>
</html>
