<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — DS Admin</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: {
        "fontFamily": {
          "display": ['"Barlow Condensed"', 'sans-serif'],
          "body":    ['"Barlow"', 'sans-serif']
        }, colors: {
          "ink": "#0B0F1A",
          "brand": "#1F5FD9",
          "lime": "#8FD11F",
          "paper": "#F7F8FA", cobalt: { 600:"#185FA5",500:"#378ADD",700:"#0D4A80" } } } } };</script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Barlow', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 font-body antialiased flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-56 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-slate-700">
      <div class="flex items-center gap-2"><img src="../assets/img/logo-ds-clean.png" alt="DS" class="h-9 w-auto"/><span class="font-display font-extrabold text-white text-sm uppercase tracking-tight leading-[1.05]">Distribuidor de<br/><span class="text-lime">Suplementos</span></span></div>
      <p class="text-slate-500 text-[11px] mt-0.5 uppercase tracking-widest">Panel de administración</p>
    </div>
    <nav class="flex-1 py-4">
      <a href="index.html"      class="flex items-center gap-3 px-5 py-2.5 bg-brand text-white text-sm font-semibold">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="productos.html"  class="flex items-center gap-3 px-5 py-2.5 text-slate-400 hover:text-lime hover:bg-slate-800 text-sm transition-colors">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        Productos
      </a>
      <a href="categorias.html" class="flex items-center gap-3 px-5 py-2.5 text-slate-400 hover:text-lime hover:bg-slate-800 text-sm transition-colors">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        Categorías
      </a>
      <a href="pedidos.html"    class="flex items-center gap-3 px-5 py-2.5 text-slate-400 hover:text-lime hover:bg-slate-800 text-sm transition-colors">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
        Pedidos
      </a>
      <a href="promociones.html" class="flex items-center gap-3 px-5 py-2.5 text-slate-400 hover:text-lime hover:bg-slate-800 text-sm transition-colors">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 12l10-9 10 9"/><rect x="4" y="12" width="16" height="9" rx="1"/><path d="M9 21v-6h6v6"/></svg>
        Promociones
      </a>
    </nav>
    <div class="px-5 py-4 border-t border-slate-700">
      <p class="text-slate-400 text-xs mb-2" id="admin-name"></p>
      <button id="logout-btn" class="text-slate-400 hover:text-red-400 text-xs transition-colors">Cerrar sesión</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-8 overflow-auto">
    <h1 class="font-display font-extrabold text-3xl uppercase tracking-tight text-white border-l-4 border-lime pl-3 mb-6">Dashboard</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="stats-grid">
      <!-- Se llena con JS -->
      <div class="bg-slate-800 rounded-none p-5 border border-slate-700 animate-pulse h-24"></div>
      <div class="bg-slate-800 rounded-none p-5 border border-slate-700 animate-pulse h-24"></div>
      <div class="bg-slate-800 rounded-none p-5 border border-slate-700 animate-pulse h-24"></div>
      <div class="bg-slate-800 rounded-none p-5 border border-slate-700 animate-pulse h-24"></div>
    </div>

    <div class="bg-slate-800 rounded-none border border-slate-700 p-6">
      <h2 class="font-display font-extrabold text-lg uppercase tracking-wide text-white border-l-4 border-lime pl-3 mb-4">Últimos pedidos</h2>
      <div id="recent-orders" class="text-slate-400 text-sm">Cargando…</div>
    </div>
  </main>

  <script src="../assets/js/admin/api-client.js"></script>
  <script src="../assets/js/admin/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Métricas simples: productos, pedidos pendientes
      Promise.all([
        DSAdminApi.apiFetch("../api/admin/products/list.php?limit=1"),
        DSAdminApi.apiFetch("../api/admin/orders/list.php?limit=5"),
        DSAdminApi.apiFetch("../api/admin/orders/list.php?limit=1&estado=pendiente"),
        DSAdminApi.apiFetch("../api/admin/categories/list.php"),
      ]).then(function (results) {
        var prods   = results[0];
        var orders  = results[1];
        var pending = results[2];
        var cats    = results[3];

        var statsEl = document.getElementById("stats-grid");
        // Número en blanco (Barlow Condensed) + barra de acento izquierda por métrica (paleta gimnasio).
        statsEl.innerHTML = [
          stat("Productos", prods.total, "#1F5FD9"),
          stat("Categorías", cats.length, "#8FD11F"),
          stat("Pedidos totales", orders.total, "#22D3EE"),
          stat("Pendientes", pending.total, "#F5B544"),
        ].join("");

        // Últimos pedidos
        var recentEl = document.getElementById("recent-orders");
        if (!orders.data || orders.data.length === 0) {
          recentEl.textContent = "Sin pedidos aún.";
          return;
        }
        recentEl.innerHTML = '<table class="w-full text-sm">' +
          '<thead><tr class="text-left text-slate-500 border-b border-slate-700">' +
            '<th class="pb-2">ID</th><th class="pb-2">Cliente</th><th class="pb-2">Total</th><th class="pb-2">Estado</th><th class="pb-2">Fecha</th>' +
          '</tr></thead><tbody>' +
          orders.data.map(function (o) {
            return '<tr class="border-b border-slate-700/50 hover:bg-slate-700/20">' +
              '<td class="py-2 font-mono text-slate-400">#' + o.id + '</td>' +
              '<td class="py-2 text-slate-200">' + esc(o.nombre_cliente) + '</td>' +
              '<td class="py-2 text-slate-300">$' + Number(o.total).toLocaleString("es-MX", {minimumFractionDigits:2}) + '</td>' +
              '<td class="py-2"><span class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300">' + o.estado + '</span></td>' +
              '<td class="py-2 text-slate-400 text-xs">' + o.created_at + '</td>' +
            '</tr>';
          }).join("") +
          '</tbody></table>';
      }).catch(function (err) {
        document.getElementById("stats-grid").innerHTML = '<p class="text-red-400 text-sm col-span-4">' + err.message + '</p>';
      });

      function stat(label, value, accent) {
        return '<div class="bg-slate-800 rounded-none p-5 border border-slate-700 border-l-[3px]" style="border-left-color:' + accent + '">' +
          '<p class="text-slate-400 text-xs font-bold uppercase tracking-wide mb-1">' + label + '</p>' +
          '<p class="font-display font-extrabold text-4xl text-white">' + (value !== undefined ? value : '—') + '</p>' +
        '</div>';
      }
      function esc(s) {
        return String(s||"").replace(/[&<>"']/g, function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
      }
    });
  </script>
</body>
</html>
